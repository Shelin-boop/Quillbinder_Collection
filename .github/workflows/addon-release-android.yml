# Official add-ons for Android (2026-11-16, decided with the first public Android release: the APK first, the add-on
# next; the same rules as .github/workflows/addon-release.yml, docs/official-addons.md): builds an add-on of another
# author for Quillbinder for Android's tablets (arm64) from the reviewed commit named in the "android" block of
# official-addons/<id>.json, packs it and checks the package: its platform and runtime, that its libraries need only
# what the app brings, and their 16 KB pages. Only when asked (input "publish") it is signed with the add-on key and
# published as the release addon-<id>-<version>-android of this repository, never marked "Latest"; the tag does not
# start with "v", so the download page and the program's release workflows leave it alone.
#
#   prepare   the entry's Android block, the newest Quillbinder for Android (0.91.3 or later)
#   build     no secrets; the only job in which the add-on's own build scripts run (Ubuntu, the Android NDK, The Qt
#             Company's Qt for Android as in Quillbinder for Android); ends with the unsigned package, its sources and
#             the release text (artifact "addon-unsigned"). A dry run (publish off) ends here.
#   sign      the release key (it vouches for the add-on key in a certificate) and the add-on key (secret
#             QB_ADDON_KEY); no third-party code; every signature checked by the program's rule
#   publish   the only job with write permission
#
# Unlike Linux and Windows, no install check runs here: Quillbinder for Android runs only on a tablet. The add-on's own
# checks that need the engine running cannot run on this machine either (the libraries are for arm64); the same source
# was built for x86_64 and run on Quillbinder's emulated tablets in its private system test.
name: Official add-on for Android

on:
  workflow_dispatch:
    inputs:
      addon:
        description: 'The add-on: its file in official-addons/, without .json'
        type: string
        required: true
        default: translation-proofreading
      publish:
        description: 'Sign and publish (needs the secret QB_ADDON_KEY); off: build and check only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: addon-release-android
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Shelin-boop/Quillbinder_Collection'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      id: ${{ steps.entry.outputs.id }}
      name: ${{ steps.entry.outputs.name }}
      version: ${{ steps.entry.outputs.version }}
      tag: ${{ steps.entry.outputs.tag }}
      repository: ${{ steps.entry.outputs.repository }}
      commit: ${{ steps.entry.outputs.commit }}
      program-tag: ${{ steps.program.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The entry's Android build
        id: entry
        env:
          ADDON: ${{ inputs.addon }}
        run: |
          set -o pipefail
          [[ "$ADDON" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || { echo "::error title=No such add-on::'$ADDON' is no name of a file in official-addons/"; exit 1; }
          [ -f "official-addons/$ADDON.json" ] || { echo "::error title=No such add-on::official-addons/$ADDON.json does not exist"; exit 1; }
          python3 -I tools/addon-entry.py check "official-addons/$ADDON.json" --android | tee -a "$GITHUB_OUTPUT"

      - name: Published already?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.entry.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$PUBLISH" = true ]; then
              echo "::error title=Published already::$TAG exists; a new version of the add-on needs a new entry (version and commit)"
              exit 1
            fi
            echo "::notice::$TAG is published already; this run builds and checks only"
          fi

      # the newest Quillbinder for Android (its own release: v<version>-android-<name>); add-ons need 0.91.3 or later
      - name: The newest Quillbinder for Android
        id: program
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          tag=$(gh api "repos/$GH_REPO/releases?per_page=30" --jq '[.[] | select(.draft | not) | .tag_name
                  | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-android-[a-z]+$"))] | .[0] // empty')
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-android-([a-z]+)$ ]] || { echo "::error::no release of Quillbinder for Android found"; exit 1; }
          ver=${BASH_REMATCH[1]}
          if [ "$(printf '%s\n0.91.3\n' "$ver" | sort -V | sed -n 1p)" != 0.91.3 ]; then
            echo "::error title=Quillbinder too old::the newest Android release is $ver; add-ons for Android need 0.91.3 or later"
            exit 1
          fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

  build:
    # the add-on's own build scripts run here, without any secret
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ID: ${{ needs.prepare.outputs.id }}
      QB_NDK: 27.2.12479018
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The add-on's reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.commit }}
          path: addon-src
          persist-credentials: false

      - name: Is it the reviewed commit?
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          have=$(git -C addon-src rev-parse HEAD)
          [ "$have" = "$COMMIT" ] || { echo "::error::the source is at $have, the entry names $COMMIT"; exit 1; }
          echo "building $COMMIT"
          echo "ENTRY=$GITHUB_WORKSPACE/official-addons/$ID.json" >> "$GITHUB_ENV"
          echo "SRC=$GITHUB_WORKSPACE/addon-src" >> "$GITHUB_ENV"
          echo "QT_VERSION=$(sed -n 's/^set(QB_QT_VERSION *"\(.*\)")/\1/p' CMakeLists.txt)" | tee -a "$GITHUB_ENV"

      # the NDK Qt names for Qt 6.12 (as Quillbinder for Android); "yes | sdkmanager" without pipefail (its broken pipe)
      - name: The Android NDK
        run: |
          set -eu
          set +o pipefail
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          if [ ! -d "$SDK/ndk/$QB_NDK" ]; then
            SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" --install "ndk;$QB_NDK" > /tmp/ndk-install.log 2>&1 || { tail -20 /tmp/ndk-install.log; exit 1; }
          fi
          test -x "$SDK/ndk/$QB_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/$QB_NDK"
            echo "READELF=$SDK/ndk/$QB_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          } >> "$GITHUB_ENV"
          if ! command -v ninja > /dev/null 2>&1; then
            (sudo apt-get update -q && sudo apt-get install -y -q ninja-build) > /tmp/ninja-install.log 2>&1 || true
          fi
          ninja --version

      - name: Qt cache
        id: qtcache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /opt/qt
          key: addon-qt-${{ env.QT_VERSION }}-android_arm64_v8a-gcc_64-v1

      # The Qt Company's Qt for Android (arm64) and for the build machine, as the add-on's own Android build installs it
      # (aqtinstall 3.3.0, which checks every archive against download.qt.io's checksums)
      - name: Qt for Android and for the build machine
        run: |
          set -euo pipefail
          if [ "${{ steps.qtcache.outputs.cache-hit }}" != "true" ]; then
            python3 -m pip install --user -q 'aqtinstall==3.3.0'
            sudo mkdir -p /opt/qt && sudo chown "$USER" /opt/qt
            python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O /opt/qt
            python3 -m aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -O /opt/qt
            rm -rf /opt/qt/"$QT_VERSION"/*/doc /opt/qt/"$QT_VERSION"/*/examples
          fi
          test -f "/opt/qt/$QT_VERSION/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "/opt/qt/$QT_VERSION/gcc_64/bin/qmake"
          {
            echo "QT_DIR=/opt/qt/$QT_VERSION/android_arm64_v8a"
            echo "QT_HOST_DIR=/opt/qt/$QT_VERSION/gcc_64"
          } >> "$GITHUB_ENV"

      - name: The folders kept between runs (their names)
        id: cache
        run: python3 -I tools/addon-entry.py cache "$ENTRY" "$SRC" --android | tee -a "$GITHUB_OUTPUT"

      - name: The folders kept between runs
        id: deps
        if: steps.cache.outputs.any == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.cache.outputs.paths }}
          key: ${{ steps.cache.outputs.key }}

      - name: The add-on's setup (when the kept folders are missing)
        id: setup
        if: steps.deps.outputs.cache-hit != 'true'
        run: python3 -I tools/addon-entry.py run "$ENTRY" setup "$SRC" --android

      - name: Keep the folders
        if: steps.cache.outputs.any == 'true' && steps.deps.outputs.cache-hit != 'true' && steps.setup.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.cache.outputs.paths }}
          key: ${{ steps.cache.outputs.key }}

      - name: Build, check and pack the add-on (its own commands)
        run: |
          mkdir -p addon-out addon-shots
          OUT="$GITHUB_WORKSPACE/addon-out" SHOTS="$GITHUB_WORKSPACE/addon-shots" python3 -I tools/addon-entry.py run "$ENTRY" steps "$SRC" --android

      - name: The package fits the entry and Quillbinder for Android
        run: |
          set -o pipefail
          ls -la addon-out
          [ "$(find addon-out -maxdepth 1 -name '*.qbpkg' | wc -l)" -eq 1 ] || { echo "::error::the add-on's commands must leave exactly one package"; exit 1; }
          python3 -I tools/addon-entry.py check-package "$ENTRY" addon-out/*.qbpkg --android

      - name: Sources and the release text
        run: |
          set -o pipefail
          mkdir -p addon-files
          cp addon-out/*.qbpkg addon-files/
          python3 -I tools/addon-entry.py sources "$ENTRY" "$SRC" addon-files --android
          python3 -I tools/addon-entry.py notes "$ENTRY" addon-out/*.qbpkg addon-files addon-notes.md --android
          cat addon-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: addon-unsigned
          path: |
            addon-files/
            addon-notes.md
          if-no-files-found: error

  sign:
    # the keys are only here: no third-party code
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: addon-unsigned
          path: unsigned

      - name: The keys
        env:
          QB_SIGNING_KEY: ${{ secrets.QB_SIGNING_KEY }}
          QB_ADDON_KEY: ${{ secrets.QB_ADDON_KEY }}
        run: |
          if [ -z "$QB_ADDON_KEY" ]; then
            echo "::error title=No add-on key::The secret QB_ADDON_KEY does not exist."
            exit 1
          fi
          [ -n "$QB_SIGNING_KEY" ] || { echo "::error title=No signing key::the secret QB_SIGNING_KEY is missing"; exit 1; }
          mkdir -p /tmp/qb-signing && chmod 700 /tmp/qb-signing
          ( umask 077; printf '%s\n' "$QB_SIGNING_KEY" > /tmp/qb-signing/key.pem; printf '%s\n' "$QB_ADDON_KEY" > /tmp/qb-signing/addon.pem )
          want=$(grep -o 'kReleaseKey\[\] = "[0-9a-f]*"' src/core/Signing.cpp | grep -o '"[0-9a-f]*"' | tr -d '"')
          have=$(openssl pkey -in /tmp/qb-signing/key.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          addon=$(openssl pkey -in /tmp/qb-signing/addon.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          [ -n "$have" ] && [ "$have" = "$want" ] || { echo "::error title=Wrong signing key::QB_SIGNING_KEY is not the key the program carries"; exit 1; }
          [ -n "$addon" ] && [ "$addon" != "$want" ] || { echo "::error title=Wrong add-on key::QB_ADDON_KEY is not an Ed25519 key of its own"; exit 1; }
          QB_SIGNING_KEY_FILE=/tmp/qb-signing/key.pem python3 -I tools/make-package.py certify --name "Quillbinder official add-ons" \
            /tmp/qb-signing/addon.pem /tmp/qb-signing/addon-cert.json
          echo "add-on key $(echo "$addon" | cut -c1-16)..., vouched for by the release key"

      - name: Sign and check
        env:
          QB_SIGNING_KEY_FILE: /tmp/qb-signing/key.pem
          QB_ADDON_KEY_FILE: /tmp/qb-signing/addon.pem
          QB_ADDON_CERT: /tmp/qb-signing/addon-cert.json
        run: |
          set -o pipefail
          mkdir -p signed
          cp -r unsigned/addon-files/. signed/
          cp unsigned/addon-notes.md .
          python3 -I tools/make-package.py sign signed/*.qbpkg
          rm -rf /tmp/qb-signing
          python3 -I tools/make-package.py verify --release-key packaging/quillbinder-signing-public.pem signed/*.qbpkg | tee verify.log
          grep -q "the add-on key 'Quillbinder official add-ons'" verify.log || { echo "::error::not signed with the add-on key"; exit 1; }
          (cd signed && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt signed/
          cat signed/SHA256SUMS.txt

      - if: always()
        run: rm -rf /tmp/qb-signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: addon-signed
          path: |
            signed/
            addon-notes.md
          if-no-files-found: error

  publish:
    # the only job with write permission
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: addon-signed
          path: addon-signed

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NAME: ${{ needs.prepare.outputs.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd addon-signed/signed && sha256sum -c SHA256SUMS.txt)
          gh release create "$TAG" --title "$NAME $VERSION for Android (official add-on)" --notes-file addon-signed/addon-notes.md \
            --latest=false --target "$GITHUB_SHA" addon-signed/signed/*
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
