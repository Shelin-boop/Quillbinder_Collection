# 0.93.0 (translator 1.3): the data the add-on "Translation and Proofreading" downloads from the release "models-3" of
# this repository: the model OPUS-MT English to German (small), converted for the engine, and the German dictionary
# (an extract of the English Wiktionary's German entries, from kaikki.org), each with its license file and a text that
# names source and license (MODEL-LICENSE.txt, DICTIONARY-LICENSE.txt, LICENSE-CC-BY-SA-4.0.txt).
#
# What it does: downloads the originals on GitHub's runner (the model from huggingface.co at a pinned revision, its
# files checked against the pins in models/convert.py; the dictionary source from kaikki.org, whose size and SHA-256
# are printed so that they can be pinned), converts and builds them (addons/translation-proofreading/source/models/
# convert.py and tools/make-de-dictionary.py), and uploads everything to the release "models-3". The release is a
# pre-release "not for downloading" (the add-on fetches what it needs), as models-1 and models-2 are. It does nothing
# when that release has the files already. A published release is never changed.
# The job "build" has no write permission and runs what was downloaded; only the job "publish" may write, and it runs
# nothing that was downloaded or built (as deps.yml and release.yml).
# After a run: copy the catalog.json of the artifact "models-3" (its models-3 entries: sizes and SHA-256 sums) into
# addons/translation-proofreading/source/resources/catalog.json in place of the placeholders.
# Runs by pushing to a branch linux/0.93.0* that changes this file or its inputs, and by hand (once it is on main).
name: Translator data (models-3)

on:
  push:
    branches: ['linux/0.93.0*']
    paths:
      - '.github/workflows/translator-data.yml'
      - 'addons/translation-proofreading/source/models/convert.py'
      - 'addons/translation-proofreading/source/tools/make-de-dictionary.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translator-data
  cancel-in-progress: false

env:
  RELEASE_TAG: models-3
  # the dictionary's source (kaikki.org's extract of the English Wiktionary, entries of the language German); its size and
  # SHA-256 are printed by the run. Put the SHA-256 here to pin it (the file changes when kaikki.org makes a new extract).
  KAIKKI_URL: https://kaikki.org/dictionary/German/kaikki.org-dictionary-German.jsonl
  KAIKKI_SHA256: 4fb15662a125085e1eb6b533a210b45edcdffa7b8e72e07634f46e1485e4e715  # 2026-11-23, 1,095,258,648 bytes, 371,793 entries
  LEGAL_URL: https://creativecommons.org/licenses/by-sa/4.0/legalcode.txt
  LEGAL_SHA256: ''

jobs:
  build:
    if: github.repository == 'Shelin-boop/Quillbinder_Collection'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Is it there already
        id: state
        run: |
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' 2>/dev/null || true)
          if grep -qxF catalog.json <<< "$have" && grep -qxF wiktionary-de--de-dictionary.qz <<< "$have" \
             && grep -qxF opus-mt-en-de--model.bin <<< "$have"; then
            echo "The release $RELEASE_TAG has the files already: nothing to do."
            echo "there=true" >> "$GITHUB_OUTPUT"
          else
            echo "there=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools for the conversion
        if: steps.state.outputs.there != 'true'
        run: |
          python3 -m venv /tmp/venv
          # the converter (ct2-transformers-converter) is a program of this environment: later steps find it on the PATH
          echo /tmp/venv/bin >> "$GITHUB_PATH"
          /tmp/venv/bin/pip install --quiet --upgrade pip
          # (CPU build of torch: the runner has no GPU; versions as models/convert.py names them: CTranslate2 4.9.0,
          # transformers 4.51 or later)
          /tmp/venv/bin/pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu \
            "ctranslate2==4.9.0" "transformers>=4.51,<4.57" "huggingface_hub<1.0" "sentencepiece" "torch>=2.4,<2.9"
          /tmp/venv/bin/pip list 2>/dev/null | grep -iE '^(ctranslate2|transformers|huggingface|sentencepiece|torch) ' | tee pip-versions.txt

      - name: Download the dictionary's source and the license text
        if: steps.state.outputs.there != 'true'
        run: |
          mkdir -p src dict out
          curl -fsSL --retry 3 -D src/kaikki-headers.txt -o src/kaikki.jsonl "$KAIKKI_URL"
          curl -fsSL --retry 3 -o src/legalcode.txt "$LEGAL_URL"
          echo "::group::Source of the dictionary (pin the SHA-256 in this workflow)"
          grep -iE '^(HTTP|last-modified|content-length|etag)' src/kaikki-headers.txt || true
          echo "URL: $KAIKKI_URL"
          echo "size: $(stat -c %s src/kaikki.jsonl) bytes, lines: $(wc -l < src/kaikki.jsonl)"
          echo "SHA-256: $(sha256sum src/kaikki.jsonl | cut -d' ' -f1)"
          echo "License text: $(stat -c %s src/legalcode.txt) bytes, SHA-256: $(sha256sum src/legalcode.txt | cut -d' ' -f1)"
          head -c 600 src/legalcode.txt; echo
          echo "::endgroup::"
          if [ -n "$KAIKKI_SHA256" ]; then echo "$KAIKKI_SHA256  src/kaikki.jsonl" | sha256sum -c -; fi
          if [ -n "$LEGAL_SHA256" ]; then echo "$LEGAL_SHA256  src/legalcode.txt" | sha256sum -c -; fi
          grep -q "Attribution-ShareAlike 4.0" src/legalcode.txt || { echo "the license text is not CC BY-SA 4.0"; exit 1; }

      - name: The dictionary extract
        if: steps.state.outputs.there != 'true'
        run: |
          python3 -I addons/translation-proofreading/source/tools/make-de-dictionary.py --selftest
          python3 -I addons/translation-proofreading/source/tools/make-de-dictionary.py src/kaikki.jsonl src/legalcode.txt dict \
            --source-url "$KAIKKI_URL" | tee dictionary.log
          ls -la dict

      - name: Convert the model, check the files, write the catalog
        if: steps.state.outputs.there != 'true'
        run: |
          /tmp/venv/bin/python -I addons/translation-proofreading/source/models/convert.py out dict 2>&1 | tee convert.log | tail -40
          ls -la out | head -30

      - name: Look at what was made
        if: steps.state.outputs.there != 'true'
        run: |
          python3 -I - <<'PY'
          import json, os
          c = json.load(open("out/catalog.json", encoding="utf-8"))
          want = {"opus-mt-en-de": 6, "wiktionary-de": 3}
          for m in c["models"]:
              if m.get("release") != "models-3":
                  continue
              assert m["id"] in want and len(m["files"]) >= want[m["id"]], m["id"]
              for f in m["files"]:
                  p = os.path.join("out", f["asset"])
                  assert os.path.getsize(p) == f["size"] > 0, p
                  print(f"{f['asset']}  {f['size']}  {f['sha256']}")
              names = {f["name"] for f in m["files"]}
              assert any("LICENSE" in n for n in names), m["id"] + " has no license file"
              want.pop(m["id"])
          assert not want, "missing: " + ", ".join(want)
          PY
          cp pip-versions.txt convert.log dictionary.log out/ 2>/dev/null || true
          cp src/kaikki-headers.txt out/kaikki-headers.txt

      - name: Hand the files to the job "publish"
        if: steps.state.outputs.there != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: models-3
          path: out
          retention-days: 7
          if-no-files-found: error

  publish:
    # the only job with write permission: it creates the release and uploads the files; no checkout, nothing built here
    needs: build
    if: github.repository == 'Shelin-boop/Quillbinder_Collection' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true   # no artifact: the release had the files already
        with:
          name: models-3
          path: out

      - name: The release models-3
        run: |
          if [ ! -f out/catalog.json ]; then echo "nothing was built (the release has the files already)"; exit 0; fi
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' 2>/dev/null || true)
          if grep -qxF catalog.json <<< "$have"; then echo "the release $RELEASE_TAG has the files already"; exit 0; fi
          cat > notes.txt <<'TXT'
          Data the add-on "Translation and Proofreading" 1.3 downloads when the writer chooses it (File > Options). Not for downloading by hand: the add-on fetches what it needs.

          - opus-mt-en-de: OPUS-MT English to German (small), by the Language Technology Research Group at the University of Helsinki, converted for the add-on's engine with 8-bit weights. License CC BY 4.0 (see opus-mt-en-de--MODEL-LICENSE.txt).
          - wiktionary-de: the German dictionary, an extract of the English Wiktionary's German entries by its contributors, taken from kaikki.org's extract and reduced. License CC BY-SA 4.0 (see wiktionary-de--DICTIONARY-LICENSE.txt and wiktionary-de--LICENSE-CC-BY-SA-4.0.txt).

          Made by .github/workflows/translator-data.yml. catalog.json lists every file with its size and SHA-256.
          TXT
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" --title "Models models-3 (not the add-on)" --notes-file notes.txt
          # no --clobber: a file that is there is never replaced
          for f in out/*; do
            n=$(basename "$f")
            if grep -qxF "$n" <<< "$have"; then echo "$n is there already"; continue; fi
            gh release upload "$RELEASE_TAG" "$f"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | "\(.name) \(.size)"'
