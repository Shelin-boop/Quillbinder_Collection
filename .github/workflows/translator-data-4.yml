# 0.95.0 (translator 1.5, the Translation Helper): the data the add-on downloads from the release "models-4" of this
# repository: the OPUS-MT models between English and Spanish, French, Portuguese, Italian, Russian, Indonesian, Turkish,
# Polish and Dutch (18 models, converted for the add-on's engine with 8-bit weights, each with its license file), and the
# dictionary of each of those languages (an extract of the English Wiktionary's entries of the language, from kaikki.org,
# each with a text that names source and license: CC BY-SA 4.0), after the pattern of translator-data.yml (models-3).
#
# What it does: the job "models" downloads the originals on GitHub's runner (from huggingface.co at the pinned revisions,
# their files checked against the pins in addons/translation-proofreading/source/models/convert.py) and converts them; one
# job "dictionaries" for each language downloads kaikki.org's file of it, prints its size and SHA-256 (put the SHA-256 into
# KAIKKI_SHA256 below to pin it) and makes the extract with tools/make-dictionary.py; a language whose job fails has no
# dictionary (the models' translations only; the other jobs go on); the job "catalog" writes the catalog of all of them
# (sizes and SHA-256 sums of every file); the job "publish" uploads everything to the release "models-4", a pre-release
# "not for downloading" (the add-on fetches what it needs), as models-1 to models-3 are. It does nothing when that release
# has the files already. A published release is never changed.
# The jobs that build have no write permission and run what was downloaded; only the job "publish" may write, and it runs
# nothing that was downloaded or built (as translator-data.yml, deps.yml and release.yml).
# After a run: copy the models-4 entries of the catalog.json of the artifact "models-4" into
# addons/translation-proofreading/source/resources/catalog.json in place of the placeholders (sizes and SHA-256 sums).
# Runs by pushing to a branch linux/0.95.0* that changes this file or its inputs, and by hand (once it is on main).
name: Translator data (models-4)

on:
  push:
    branches: ['linux/0.95.0*']
    paths:
      - '.github/workflows/translator-data-4.yml'
      - 'addons/translation-proofreading/source/models/convert.py'
      - 'addons/translation-proofreading/source/tools/make-dictionary.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translator-data-4
  cancel-in-progress: false

env:
  RELEASE_TAG: models-4
  LEGAL_URL: https://creativecommons.org/licenses/by-sa/4.0/legalcode.txt
  LEGAL_SHA256: ''

jobs:
  models:
    if: github.repository == 'Shelin-boop/Quillbinder_Collection'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      there: ${{ steps.state.outputs.there }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Is it there already
        id: state
        run: |
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' 2>/dev/null || true)
          if grep -qxF catalog.json <<< "$have" && grep -qxF opus-mt-es-en--model.bin <<< "$have" \
             && grep -qxF opus-mt-en-pt--model.bin <<< "$have"; then
            echo "The release $RELEASE_TAG has the files already: nothing to do."
            echo "there=true" >> "$GITHUB_OUTPUT"
          else
            echo "there=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools for the conversion
        if: steps.state.outputs.there != 'true'
        run: |
          python3 -m venv /tmp/venv
          # the converter (ct2-transformers-converter) is a program of this environment: later steps find it on the PATH
          echo /tmp/venv/bin >> "$GITHUB_PATH"
          /tmp/venv/bin/pip install --quiet --upgrade pip
          # (CPU build of torch: the runner has no GPU; versions as models/convert.py names them)
          /tmp/venv/bin/pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu \
            "ctranslate2==4.9.0" "transformers>=4.51,<4.57" "huggingface_hub<1.0" "sentencepiece" "torch>=2.4,<2.9"
          /tmp/venv/bin/pip list 2>/dev/null | grep -iE '^(ctranslate2|transformers|huggingface|sentencepiece|torch) ' | tee pip-versions.txt

      - name: Convert the models, check the files
        if: steps.state.outputs.there != 'true'
        run: |
          mkdir -p out
          # without a dictionary folder: the dictionaries are made by the other jobs and added by the job "catalog"
          /tmp/venv/bin/python -I addons/translation-proofreading/source/models/convert.py out 2>&1 | tee convert.log | tail -60
          ls -la out | head -40

      - name: Look at what was made
        if: steps.state.outputs.there != 'true'
        run: |
          python3 -I - <<'PY'
          import json, os
          c = json.load(open("out/catalog.json", encoding="utf-8"))
          seen = []
          for m in c["models"]:
              if m.get("release") != "models-4":
                  continue
              assert len(m["files"]) >= 6, m["id"]
              for f in m["files"]:
                  p = os.path.join("out", f["asset"])
                  assert os.path.getsize(p) == f["size"] > 0, p
                  print(f"{f['asset']}  {f['size']}  {f['sha256']}")
              assert any("LICENSE" in f["name"] for f in m["files"]), m["id"] + " has no license file"
              seen.append(m["id"])
          assert len(seen) == 18, f"expected 18 models, found {len(seen)}: {seen}"
          PY
          cp pip-versions.txt convert.log out/ 2>/dev/null || true

      - name: Hand the files to the next jobs
        if: steps.state.outputs.there != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: models-4-models
          path: out
          retention-days: 7
          if-no-files-found: error

  dictionaries:
    # one job for each language; a language that fails has no dictionary (the models' translations only)
    needs: models
    if: github.repository == 'Shelin-boop/Quillbinder_Collection' && needs.models.outputs.there != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {code: es, name: Spanish, sha256: ''}
          - {code: fr, name: French, sha256: ''}
          - {code: pt, name: Portuguese, sha256: ''}
          - {code: it, name: Italian, sha256: ''}
          - {code: ru, name: Russian, sha256: ''}
          - {code: id, name: Indonesian, sha256: ''}
          - {code: tr, name: Turkish, sha256: ''}
          - {code: pl, name: Polish, sha256: ''}
          - {code: nl, name: Dutch, sha256: ''}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the dictionary's source and the license text
        env:
          KAIKKI_URL: https://kaikki.org/dictionary/${{ matrix.name }}/kaikki.org-dictionary-${{ matrix.name }}.jsonl
          KAIKKI_SHA256: ${{ matrix.sha256 }}   # empty: not pinned yet (the run prints the SHA-256)
        run: |
          mkdir -p src dict
          curl -fsSL --retry 3 -D src/kaikki-headers.txt -o src/kaikki.jsonl "$KAIKKI_URL"
          curl -fsSL --retry 3 -o src/legalcode.txt "$LEGAL_URL"
          echo "::group::Source of the dictionary (pin the SHA-256 in this workflow)"
          grep -iE '^(HTTP|last-modified|content-length|etag)' src/kaikki-headers.txt || true
          echo "URL: $KAIKKI_URL"
          echo "size: $(stat -c %s src/kaikki.jsonl) bytes, lines: $(wc -l < src/kaikki.jsonl)"
          echo "SHA-256: $(sha256sum src/kaikki.jsonl | cut -d' ' -f1)"
          echo "License text: $(stat -c %s src/legalcode.txt) bytes, SHA-256: $(sha256sum src/legalcode.txt | cut -d' ' -f1)"
          echo "::endgroup::"
          if [ -n "$KAIKKI_SHA256" ]; then echo "$KAIKKI_SHA256  src/kaikki.jsonl" | sha256sum -c -; fi
          if [ -n "$LEGAL_SHA256" ]; then echo "$LEGAL_SHA256  src/legalcode.txt" | sha256sum -c -; fi
          grep -q "Attribution-ShareAlike 4.0" src/legalcode.txt || { echo "the license text is not CC BY-SA 4.0"; exit 1; }

      - name: The dictionary extract
        env:
          KAIKKI_URL: https://kaikki.org/dictionary/${{ matrix.name }}/kaikki.org-dictionary-${{ matrix.name }}.jsonl
        run: |
          python3 -I addons/translation-proofreading/source/tools/make-dictionary.py --selftest
          python3 -I addons/translation-proofreading/source/tools/make-dictionary.py "${{ matrix.code }}" src/kaikki.jsonl src/legalcode.txt \
            dict/${{ matrix.code }} --source-url "$KAIKKI_URL" | tee dictionary.log
          ls -la dict/${{ matrix.code }}

      - name: Hand the files to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictionary-${{ matrix.code }}
          path: dict/${{ matrix.code }}
          retention-days: 7
          if-no-files-found: error

  catalog:
    # the step "Write the catalog": the catalog of the models and of the dictionaries that were made, with every file's
    # size and SHA-256 (what the placeholders in resources/catalog.json stand for)
    needs: [models, dictionaries]
    if: ${{ !cancelled() && github.repository == 'Shelin-boop/Quillbinder_Collection' && needs.models.result == 'success' && needs.models.outputs.there != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models-4-models
          path: out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # no dictionary was made: the models alone
        with:
          pattern: dictionary-*
          path: dict
          # one folder for each language: dict/dictionary-<code>/

      - name: Write the catalog
        run: |
          mkdir -p dict-by-code
          for d in dict/dictionary-*; do [ -d "$d" ] && mv "$d" "dict-by-code/${d##*/dictionary-}"; done || true
          ls dict-by-code || true
          python3 -I addons/translation-proofreading/source/models/convert.py --assemble out dict-by-code | tee catalog.log
          cp catalog.log out/
          python3 -I - <<'PY'
          import json, os
          c = json.load(open("out/catalog.json", encoding="utf-8"))
          for m in c["models"]:
              if m.get("release") != "models-4":
                  continue
              for f in m["files"]:
                  p = os.path.join("out", f["asset"])
                  assert os.path.getsize(p) == f["size"] > 0, p
              print(m["id"], "ok")
          print("dictionaries:", sorted(m["language"] for m in c["models"] if m.get("language") and m.get("release") == "models-4"))
          PY

      - name: Hand the files to the job "publish"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: models-4
          path: out
          retention-days: 7
          if-no-files-found: error

  publish:
    # the only job with write permission: it creates the release and uploads the files; no checkout, nothing built here
    needs: catalog
    if: github.repository == 'Shelin-boop/Quillbinder_Collection' && needs.catalog.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models-4
          path: out

      - name: The release models-4
        run: |
          if [ ! -f out/catalog.json ]; then echo "nothing was built (the release has the files already)"; exit 0; fi
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' 2>/dev/null || true)
          if grep -qxF catalog.json <<< "$have"; then echo "the release $RELEASE_TAG has the files already"; exit 0; fi
          cat > notes.txt <<'TXT'
          Data the add-on "Translation Helper" (Translation and Proofreading before 1.5) 1.5 downloads when the writer chooses it (File > Options). Not for downloading by hand: the add-on fetches what it needs.

          - opus-mt-<from>-<to>: OPUS-MT models between English and Spanish, French, Portuguese, Italian, Russian, Indonesian, Turkish, Polish and Dutch, by the Language Technology Research Group at the University of Helsinki, converted for the add-on's engine with 8-bit weights. License Apache-2.0 or CC BY 4.0 (see each model's MODEL-LICENSE.txt).
          - wiktionary-<code>: the dictionary of a language (es, fr, pt, it, ru, id, tr, pl, nl), an extract of the English Wiktionary's entries of the language by its contributors, taken from kaikki.org's extract and reduced. License CC BY-SA 4.0 (see wiktionary-<code>--DICTIONARY-LICENSE.txt and wiktionary-<code>--LICENSE-CC-BY-SA-4.0.txt). A language may have none.

          Made by .github/workflows/translator-data-4.yml. catalog.json lists every file with its size and SHA-256.
          TXT
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" --title "Models models-4 (not the add-on)" --notes-file notes.txt
          # no --clobber: a file that is there is never replaced
          for f in out/*; do
            n=$(basename "$f")
            if grep -qxF "$n" <<< "$have"; then echo "$n is there already"; continue; fi
            gh release upload "$RELEASE_TAG" "$f"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | "\(.name) \(.size)"'
